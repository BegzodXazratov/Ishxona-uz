<html lang="uz">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f20;--ink:#1c1830;--accent:#ffcf4a;--hot:#ff4d5e;--fg:#f4efff;--muted:#b9b2dd;--pixel:'Silkscreen',ui-monospace,'Courier New',monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--pixel);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}
#game.drag{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(10,6,24,.55) 100%)}
#micWrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;transition:top .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1);z-index:5}
#micWrap.docked{top:calc(100% - 64px - env(safe-area-inset-bottom,0px));transform:translate(-50%,-50%)}
#mic{position:relative;width:104px;height:104px;border-radius:50%;border:4px solid var(--ink);background:var(--accent);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 0 var(--ink),0 0 0 8px rgba(255,207,74,.18),0 18px 40px rgba(0,0,0,.45);transition:width .5s,height .5s,background .3s,transform .1s}
#mic:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink),0 0 0 8px rgba(255,207,74,.18)}
#mic svg{width:46%;height:46%}
#micWrap.docked #mic{width:76px;height:76px}
#mic.on{background:var(--hot);color:#fff}
#mic.shout{background:#7ce0a3}
#ring{position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--hot);opacity:0;pointer-events:none;transition:transform .08s linear,opacity .2s}
#mic.on #ring{opacity:.9}
#mic:focus-visible{outline:3px solid #fff;outline-offset:6px}

.micRow{display:flex;align-items:center;gap:14px}
.side{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#2b2648;color:var(--fg);font-family:var(--pixel);font-size:13px;cursor:pointer;box-shadow:0 4px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .3s}
#micWrap.docked .side{opacity:1;pointer-events:auto}
.side:focus-visible{outline:3px solid #fff;outline-offset:3px}
#typeForm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;width:min(440px,calc(100vw - 32px));z-index:6}
#typeForm[hidden]{display:none}
#typeIn{flex:1;min-width:0;font:14px var(--pixel);padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:rgba(18,15,32,.92);color:var(--fg);outline:none}
#typeIn:focus{border-color:var(--accent)}
#typeForm button{font:700 13px var(--pixel);padding:0 14px;border-radius:10px;border:2px solid var(--ink);background:var(--accent);color:var(--ink);cursor:pointer}
#micHint{font-size:13px;text-align:center;line-height:1.5;background:rgba(18,15,32,.82);border:2px solid var(--ink);padding:10px 14px;border-radius:10px;max-width:min(340px,86vw);text-shadow:0 1px 0 #000}
#micHint b{color:var(--accent);font-weight:700}
#micHint small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#micWrap.docked #micHint{display:none}
#heard{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;transition:opacity .25s,transform .25s;background:rgba(18,15,32,.88);border:2px solid var(--ink);color:var(--fg);padding:8px 14px;border-radius:10px;font-size:13px;max-width:min(560px,90vw);text-align:center;pointer-events:none;z-index:6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#heard.show{opacity:1;transform:translate(-50%,0)}
#heard.cmd{border-color:var(--accent)}
#heard b{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){#micWrap{transition:none}}
</style>
</head>

</div>

<script>
(()=>{
/* ================= world ================= */
const T=16, COLS=80, ROWS=48, WW=COLS*T, WH=ROWS*T;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srnd=mulberry(20261030);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hsh=(x,y)=>(((x*73856093)^(y*19349663))>>>0);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const solid=[...Array(ROWS)].map(()=>new Uint8Array(COLS));   // 1 wall, 2 furniture
const floor=[...Array(ROWS)].map(()=>Array(COLS).fill('wood'));
const area=(x0,y0,x1,y1,f)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)floor[y][x]=f};
area(32,2,46,14,'dev'); area(48,2,62,14,'studio'); area(32,16,40,24,'tile'); area(41,16,62,24,'lounge');
area(1,26,20,38,'meet'); area(22,26,41,38,'design'); area(43,26,62,38,'boss');
area(64,2,78,14,'sales'); area(64,16,78,24,'gym'); area(64,26,78,38,'recep'); area(1,40,30,46,'canteen'); area(32,40,51,46,'nap'); area(53,40,78,46,'bill');
for(let x=0;x<COLS;x++){solid[0][x]=1;solid[1][x]=1;solid[ROWS-1][x]=1}
for(let y=0;y<ROWS;y++){solid[y][0]=1;solid[y][COLS-1]=1}
const doors=[];
function hwall(y,x0,x1,d){for(let x=x0;x<=x1;x++){if(d.includes(x)){doors.push([x,y,'h']);floor[y][x]=floor[y+1][x]}else solid[y][x]=1}}
function vwall(x,y0,y1,d){for(let y=y0;y<=y1;y++){if(d.includes(y)){doors.push([x,y,'v']);floor[y][x]=floor[y][x-1]}else solid[y][x]=1}}
vwall(31,2,24,[8,9,19,20]); hwall(15,32,62,[38,39,55,56]); vwall(47,2,14,[10,11]);
hwall(25,1,62,[10,11,28,29,52,53]); vwall(21,26,38,[]); vwall(42,26,38,[]);
vwall(63,2,38,[8,9,22,23,33,34]); hwall(15,64,78,[71,72]); hwall(25,64,78,[71,72]); hwall(39,1,78,[10,11,38,39,60,61,70,71]); vwall(31,40,46,[]); vwall(52,40,46,[]);
const blk=(x,y,w=1,h=1)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)solid[j][i]=2};
const walkable=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS&&!solid[y][x];

/* ---- spots ---- */
const spots=[];
function spot(x,y,act,face,sit,o={}){const s={x,y,act,face,sit,taken:null,...o};spots.push(s);return s}
const desks=[], homes=[];
function desk(x,y,kind,team){blk(x,y,3,2);const s=spot(x+1,y+2,'work','u',true,{home:true,chairBack:true,team});const d={x,y,kind,seat:s};desks.push(d);s.desk=d;homes.push(s);return d}
for(const y of [4,10,16])for(const x of [2,8,14,20,26])desk(x,y,'wood','mkt');
for(const y of [4,9])for(const x of [33,37,41])desk(x,y,'dev','dev');
[[24,28],[30,28],[24,33],[30,33],[35,33]].forEach(([x,y])=>desk(x,y,'white','dsg'));
homes.push(spot(54,4,'present','d',false,{home:true,team:'std'}));
homes.push(spot(54,9,'cam','u',false,{home:true,team:'std'}));
blk(58,11,3,2); homes.push(spot(59,13,'work','u',true,{home:true,chairBack:true,edit:true,team:'std'}));
for(const y of [4,9])for(const x of [65,69,73])desk(x,y,'sales','sales');
blk(68,29,5,1); homes.push(spot(70,28,'recep','d',true,{home:true,team:'recep'}));
blk(3,41,2,2); homes.push(spot(5,42,'cook','l',false,{home:true,team:'cook'}));

// furniture blocks
[[1,2],[30,2],[1,24],[30,24],[32,14],[46,14],[48,14],[32,24],[41,24],[62,24],[1,26],[20,26],[1,38],[20,38],[22,26],[41,26],[22,38],[43,26],[62,38],[62,30]].forEach(([x,y])=>blk(x,y));
blk(2,22); blk(14,23,2,1); blk(45,3,2,4); blk(51,2,7,1); blk(50,4); blk(58,4); blk(54,8); blk(61,2,2,1);
blk(33,16,4,1); blk(40,16); blk(34,21,3,2); blk(44,19,4,2); blk(53,19,3,1); blk(60,16,2,1); blk(62,19,1,2);
blk(5,30,11,3); blk(17,26,3,1); blk(36,26,5,1); blk(39,37,2,1);
blk(44,26,5,1); blk(61,26); blk(50,31,5,2); blk(52,33); blk(51,29); blk(53,29); blk(57,36,4,1);
[[64,2],[78,14],[64,24],[78,16],[64,26],[78,38],[64,38],[1,46],[30,40],[32,46],[51,40],[53,46],[78,46]].forEach(([x,y])=>blk(x,y));
blk(77,3,1,1); blk(75,18); blk(77,21,1,3); blk(73,35,4,1);
blk(9,42,6,2); blk(18,42,6,2); blk(1,41,1,4); blk(58,42,5,3); blk(70,41,7,1); blk(53,41,1,1);

// break spots
[33,34,35,36].forEach(x=>spot(x,17,'coffee','u',false));
spot(3,22,'water','l',false); spot(2,23,'water','u',false);
spot(33,21,'chat','r',true); spot(33,22,'chat','r',true); spot(37,21,'chat','l',true); spot(37,22,'chat','l',true);
const pongA=spot(43,19,'pong','r',false), pongB=spot(48,20,'pong','l',false);
[52,53,54,55,56].forEach(x=>spot(x,17,'sofa','d',true,{sofa:'#3fb3aa'}));
spot(52,21,'sofa','u',true,{bean:'#ffcf4a'}); spot(56,21,'sofa','u',true,{bean:'#5b7cfa'});
spot(60,17,'arcade','u',false); spot(61,17,'arcade','u',false);
spot(50,19,'chat','r',false); spot(58,19,'chat','l',false);
[24,25,26,27].forEach(x=>spot(x,22,'sofa','d',true,{sofa:'#e4572e'}));
spot(37,27,'chat','u',false); spot(39,27,'chat','u',false);
[66,68,70].forEach(x=>spot(x,18,'run','u',false,{tread:true}));
spot(75,19,'boxing','u',false);
[66,68,70].forEach(x=>spot(x,22,'yoga','d',false,{mat:true}));
for(let x=9;x<=14;x++){spot(x,41,'eat','d',true);spot(x,44,'eat','u',true,{chairBack:true})}
for(let x=18;x<=23;x++){spot(x,41,'eat','d',true);spot(x,44,'eat','u',true,{chairBack:true})}
[34,37,40,43,46,49].forEach(x=>spot(x,42,'nap','d',true,{bed:true}));
spot(57,43,'pool','r',false); spot(63,43,'pool','l',false);
for(let x=70;x<=76;x++)spot(x,42,'chat','u',true,{stool:true});
[65,66,67].forEach(x=>spot(x,34,'sofa','u',true,{sofa:'#5b7cfa'}));
const meetChairs=[];
for(let x=5;x<=15;x++){meetChairs.push(spot(x,29,'meet','d',true,{meetChair:true}));meetChairs.push(spot(x,33,'meet','u',true,{meetChair:true,chairBack:true}))}
const breakSpots=spots.filter(s=>['coffee','water','chat','pong','sofa','arcade','run','boxing','yoga','eat','nap','pool'].includes(s.act));

const REG={
  lounge:[32,16,62,24], meet:[1,26,20,38], open:[1,2,30,24], all:[1,2,78,46], boss:[43,26,62,38], gym:[64,16,78,24], canteen:[1,40,30,46], recep:[64,26,78,38], sales:[64,2,78,14], bill:[53,40,78,46]
};
const reservedTiles=new Set();
function randomTile(r,tries=60){const[x0,y0,x1,y1]=REG[r];for(let i=0;i<tries;i++){const x=Math.floor(rand(x0,x1+1)),y=Math.floor(rand(y0,y1+1));const k=x+','+y;if(walkable(x,y)&&!reservedTiles.has(k)&&!spots.some(s=>s.x===x&&s.y===y))return{x,y,face:pick(['d','l','r']),sit:false,tile:true,key:k}}return null}

/* ---- path ---- */
const prev=new Int32Array(COLS*ROWS);
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(sx,sy,tx,ty){
  prev.fill(-1);const st=sy*COLS+sx,gl=ty*COLS+tx;const q=[st];prev[st]=st;let h=0;
  const ord=shuffle(D4.slice());
  while(h<q.length){const c=q[h++];if(c===gl)break;const cx=c%COLS,cy=(c/COLS)|0;
    for(const[dx,dy]of ord){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const n=ny*COLS+nx;
      if(prev[n]!==-1)continue;if(solid[ny][nx]&&n!==gl)continue;prev[n]=c;q.push(n)}}
  if(prev[gl]===-1)return null;const out=[];let c=gl;while(c!==st){out.push({x:c%COLS,y:(c/COLS)|0});c=prev[c]}return out.reverse();
}

/* ================= people ================= */
const SKIN=['#f6d2a8','#eab884','#d39a68','#a8714a','#7a4c30','#ffdfc0'];
const HAIR=['#24180f','#3d2516','#121016','#6b3b22','#8f5a2c','#d9b06a','#4a4a55','#a33a2a'];
const SHIRT=['#e4572e','#29a19c','#ffcf4a','#5b7cfa','#b26bff','#ef6f9b','#3fbf6f','#ff8c42','#4cc9f0','#e94f64','#8bd450','#f7f2e8','#2f3a5a','#c05a2a'];
const PANTS=['#2d3047','#3b3355','#24384f','#4a3b2f','#2e2e3a','#5a4a3a','#1f2a3a'];
const SCARF=['#e94f64','#5b7cfa','#3fbf6f','#b26bff','#f7f2e8','#ff8c42'];
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return'#'+((1<<24)|(c(n>>16)<<16)|(c(n>>8&255)<<8)|c(n&255)).toString(16).slice(1)};

const NAMES=[['Aziz',0],['Dilnoza',1],['Sardor',0],['Malika',1],['Javlon',0],['Nodira',1],["Ulug'bek",0],['Shahzoda',1],['Otabek',0],['Feruza',1],['Sherzod',0],['Kamola',1],['Jahongir',0],['Madina',1],['Rustam',0],
  ['Zarina',1],['Akmal',0],['Gulnoza',1],['Doniyor',0],['Lola',1],['Bobur',0],
  ['Sevara',1],['Farrux',0],['Nigora',1],['Timur',0],['Munisa',1],
  ['Diyor',0],['Asal',1],['Islom',0],
  ['Sanjar',0],['Mohira',1],['Jamshid',0],['Dildora',1],['Shoxrux',0],['Komil',0],['Nilufar',1],['Rahim',0]];
const ALIAS={farrux:['farruh','faruh','farrukh'],doniyor:['daniyar','doniyar','daniyor'],islom:['islam'],timur:['temur'],javlon:['javlan','djavlon'],diyor:['diyar'],bobur:['babur'],ulugbek:['ulug bek','ulugbeg'],jahongir:['jaxongir','djahongir','jahangir'],sherzod:['sherzot'],shahzoda:['shaxzoda'],gulnoza:['gulnaza'],nigora:['nigara'],dilnoza:['dilnaza'],kamola:['kamala'],lola:['lala'],otabek:['atabek'],sardor:['sardar'],munisa:['munisa'],zarina:['zarina'],shoxrux:['shohruh','shaxrux','shohrux'],jamshid:['jamshed','djamshid'],dildora:['dildara'],nilufar:['nilufar','nilyufar'],rahim:['raxim','rahim aka'],komil:['kamil'],sanjar:['sanjar'],mohira:['moxira']};
const PERS=['qorqoq','dangasa','xushomad','isyon','hazil','jiddiy','asabiy'];
const persList=[];for(let i=0;i<NAMES.length;i++)persList.push(PERS[i%PERS.length]);
for(let i=persList.length-1;i>0;i--){const j=Math.floor(srnd()*(i+1));[persList[i],persList[j]]=[persList[j],persList[i]]}
const keyOf=n=>n.toLowerCase().replace(/[^a-z]/g,'');

function dressUp(o,fem){
  o.fem=fem;o.style=fem?(srnd()<.3?4:srnd()<.55?1:2):(srnd()<.25?3:0);
  o.skin=SKIN[Math.floor(srnd()*SKIN.length)];o.hair=HAIR[Math.floor(srnd()*HAIR.length)];o.scarf=SCARF[Math.floor(srnd()*SCARF.length)];
  if(!o.shirt)o.shirt=SHIRT[Math.floor(srnd()*SHIRT.length)];o.shirtD=shade(o.shirt,.72);o.pants=PANTS[Math.floor(srnd()*PANTS.length)];
  o.collar=srnd()<.35;o.tie=srnd()<.18?['#e94f64','#2f3a5a','#ffcf4a'][Math.floor(srnd()*3)]:null;o.glasses=srnd()<.2;o.beard=!fem&&srnd()<.25;
  return o;
}
function baseBody(x,y,dest){return{x,y,dir:'d',dest,path:[],state:'idle',act:'idle',next:null,nextDur:0,timer:5,run:false,anim:Math.random()*10,blink:rand(1,5),panic:0,
  fx:{jump:0,jumpMax:1,shake:0,spin:0},bubble:null,scene:null,hidden:false,dizzy:0,box:false,bulb:0,flash:false,onArrive:null,faceOverride:null,mood:60,pokes:0}}
const agents=homes.map((h,i)=>{
  const [name,fem]=NAMES[i];const key=keyOf(name);
  const a=Object.assign(baseBody(h.x,h.y,h),{id:i,home:h,name,key,keys:[key,...(ALIAS[key]||[])],pers:persList[i],
    team:h.team,act:h.act,dir:h.face,timer:rand(2,14),mood:rand(45,80)});
  return dressUp(a,!!fem);
});
const extras=[];
const allPeople=()=>agents.concat(extras);
const ENTRY={x:78,y:32};
[3,9,17,22,12].forEach((id,k)=>{const a=agents[id];if(!a)return;const s=breakSpots.filter(s=>!s.taken)[k*3%breakSpots.length];if(!s||s.taken)return;s.taken=a;a.x=s.x;a.y=s.y;a.dest=s;a.act=s.act;a.timer=rand(4,12)});

const pets={cat:{x:45,y:37,path:[],timer:5,dir:'r',sit:true,anim:0,bubble:null,fx:{jump:0},lock:false,fast:false},bot:{x:12,y:20,path:[],timer:1,anim:0,turbo:0}};

/* ================= behaviour ================= */
const SPEED=3.4;
const L={
  chat:["Plov qachon?","Reels portladi!","Kecha futbol!","Dedlayn ertaga…","Mem ko'rdingmi?","Mijoz yana o'zgartirdi","Kofe tugadi","Oylik qachon?"],
  coffee:["Bir finjon…","Qahva vaqti","Energiya +100"],
  pong:["Ochko!","Mana senga!","Hali ko'rasan","Out edi!"],
  arcade:["Rekord!","Yana bir o'yin"],
  present:["Assalomu alaykum!","Obuna bo'ling!","Dubl 3","Kadr!"],
  think:["Hmm…","Render…","Deploy…","Lid keldi!","CTR o'sdi","Bug topdim"],
  meet:["Kim gapiradi?","Bloknot qani?","Yana majlis…"],
  sofa:["Rohat…","Telefon zaryadi?","Charchadim"],
  run:["Yana 1 km!","Kardio!","Hansirayapman"],boxing:["Hu-ha!","TUK!","Dedlayn, mana senga!"],yoga:["Ommm…","Nafas…"],eat:["Mazali!","Yana bir kosa!","Non bering"],
  nap:["Zzz"],pool:["Cho'ntakka!","Zo'r zarba","Kiy qani?"],cook:["Plov pishyapti!","Zirasi kam","Kim och?"],recep:["Xush kelibsiz!","Kutib turing","Allo, TASMA!"]
};
let quietT=0;
function bubbles(){let n=0;for(const a of allPeople())if(a.bubble)n++;return n}

function goTo(a,dest,act,dur,run=false){
  if(a.onArrive){const cb=a.onArrive;a.onArrive=null;cb()}
  release(a);
  if(dest.tile)reservedTiles.add(dest.key);else if(!dest.home)dest.taken=a;
  a.target=dest;a.next=act;a.nextDur=dur;a.run=run;
  const p=findPath(Math.round(a.x),Math.round(a.y),dest.x,dest.y);

  a.path=p;a.state='walk';
}

function sendHome(a,run=false){if(!a.home)return;goTo(a,a.home,a.home.act,a.home.act==='work'?rand(12,24):rand(25,40),run)}

const nearest=(p,n,f=()=>true)=>freeList(b=>b!==p&&f(b)).sort((q,r)=>dist(p,q)-dist(p,r)).slice(0,n);
function nearTile(x,y,r){for(let i=0;i<50;i++){const tx=Math.round(x+rand(-r,r)),ty=Math.round(y+rand(-r,r));if(walkable(tx,ty)&&!spots.some(s=>s.x===tx&&s.y===ty&&s.taken)&&!reservedTiles.has(tx+','+ty))return{x:tx,y:ty}}const t=randomTile('all');return t?{x:t.x,y:t.y}:{x:Math.round(x),y:Math.round(y)}}
function besideTile(a){const x=Math.round(a.x),y=Math.round(a.y);for(const[dx,dy]of shuffle([[1,0],[-1,0],[0,1],[1,1],[-1,1]])){if(walkable(x+dx,y+dy)&&!(spots.some(s=>s.x===x+dx&&s.y===y+dy&&s.taken)))return{x:x+dx,y:y+dy}}return nearTile(x,y,2)}
function faceTo(a,b){const dx=b.x-a.x,dy=b.y-a.y;a.faceOverride=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u')}

function decide(a){
  if(a.dest!==a.home){sendHome(a);return}
  if(a.act==='work'){
    const r=Math.random();
    const sleepy=a.pers==='dangasa'?.16:.05;
    if(r<sleepy){a.act='sleep';a.timer=rand(14,26);return}
    if(r<.5){a.timer=rand(10,22);return}
    const free=breakSpots.filter(s=>!s.taken);
    const naps=free.filter(s=>s.act==='nap');
    if(a.pers==='dangasa'&&naps.length&&Math.random()<.5){goTo(a,pick(naps),'nap',rand(15,25));return}
    if(free.length){const s=pick(free);goTo(a,s,s.act,rand(9,18));return}
    a.timer=rand(8,14);return;
  }
  if(a.act==='sleep'){a.act='work';a.timer=rand(10,20);say(a,'Uxlamadim!');return}
  if(Math.random()<.35){const free=spots.filter(s=>s.act==='coffee'&&!s.taken);if(free.length){goTo(a,pick(free),'coffee',rand(6,10));return}}
  a.timer=rand(20,35);
}

let gameTime=0;const waits=[];
function wait(s){return new Promise(r=>waits.push({t:gameTime+s,r}))}
function tickWaits(){for(let i=waits.length-1;i>=0;i--)if(waits[i].t<=gameTime){const w=waits[i];waits.splice(i,1);w.r()}}
const ABORT={abort:1};let sceneSeq=0;const scenes=new Map();const fights=[];
const props={cake:0,pizza:0,night:0};
function freeAgent(a){if(a.onArrive){const cb=a.onArrive;a.onArrive=null;cb()}a.scene=null;a.hidden=false;a.faceOverride=null;a.box=false;a.flash=false}
function runScene(core,fn){
  const id=++sceneSeq;const sc={id,core:[...core],all:[...core]};scenes.set(id,sc);
  core.forEach(a=>{a.scene=id;a.faceOverride=null});
  const S={id,
    ok:()=>sc.core.every(a=>a.scene===id),
    chk(){if(!S.ok())throw ABORT},
    async wait(s){await wait(s);S.chk()},
    in:a=>a&&a.scene===id,
    join(a,isCore=false){if(!freeA(a))return false;a.scene=id;a.faceOverride=null;sc.all.push(a);if(isCore)sc.core.push(a);return true},
    adopt(a){a.scene=id;sc.all.push(a);sc.core.push(a)},
    say(a,t,d=2.2){if(S.in(a))say(a,t,d,true)},
    move(a,x,y,run=false,face='d'){return new Promise(res=>{if(!S.in(a))return res();a.faceOverride=null;goTo(a,tileDest(x,y,face),'scene',999,run);if(a.state==='walk')a.onArrive=res;else res()})},
    async walk(a,x,y,run=false,face){await S.move(a,x,y,run,face);S.chk()},
    pose(a,act){if(S.in(a))a.act=act},
  };
  (async()=>{try{await fn(S)}catch(e){if(e!==ABORT)console.error(e)}finally{
    scenes.delete(id);for(let i=fights.length-1;i>=0;i--)if(fights[i].sid===id)fights.splice(i,1);
    for(const a of sc.all){if(a.scene!==id)continue;a.scene=null;a.hidden=false;a.faceOverride=null;a.box=false;a.flash=false;
      if(!a.home){const k=extras.indexOf(a);if(k>=0)extras.splice(k,1);continue}
      if(a.dest!==a.home||a.act==='scene')sendHome(a)}}})();
  return S;
}

  else{const[w,l]=Math.random()<.5?[a,b]:[b,a];l.dizzy=4;S.say(w,'Ha!',1.6);jump(w,1.2);crowd.forEach(c=>{if(S.in(c)&&Math.random()<.5)say(c,pick(['Voy!','Uuu!','Kuchli!']),1.4,true)});await S.wait(2.5);S.say(l,"Hali ko'rasan…",2);l.mood-=15;await S.wait(2)}
}

function updateAgent(a,dt){
  a.anim+=dt;a.blink-=dt;if(a.blink<-0.12)a.blink=rand(2,6);
  if(a.bubble){a.bubble.t-=dt;if(a.bubble.t<=0)a.bubble=null}
  if(a.panic>0)a.panic-=dt;if(a.dizzy>0)a.dizzy-=dt;if(a.bulb>0)a.bulb-=dt;
  a.mood=Math.max(0,Math.min(100,a.mood+dt*.15*(60-a.mood)/60));
  for(const k of['jump','shake','spin'])if(a.fx[k]>0)a.fx[k]-=dt;
  if(a.state==='walk'){
    let step=SPEED*(a.run?2.4:1)*(a.pers==='dangasa'&&!a.run?.75:1)*dt;
    while(step>0&&a.path.length){const n=a.path[0],dx=n.x-a.x,dy=n.y-a.y,d=Math.hypot(dx,dy);
      if(Math.abs(dx)>Math.abs(dy))a.dir=dx>0?'r':'l';else if(dy)a.dir=dy>0?'d':'u';
      if(d<=step){a.x=n.x;a.y=n.y;a.path.shift();step-=d}else{a.x+=dx/d*step;a.y+=dy/d*step;step=0}}
    if(a.run&&!a.hidden&&Math.random()<dt*6)part('dust',a.x*T+8,a.y*T+15,rand(-10,10),rand(-8,-2),.4,'#ffffff');
    if(!a.path.length)arrive(a);
    return;
  }
  if(a.scene||a.hidden)return;
  a.timer-=dt;
  if(a.act==='flee'){if(mode==='fire'){const t=randomTile('all');if(t)goTo(a,t,'flee',.1,true)}else{sendHome(a);if(Math.random()<.3)say(a,pick(['Hazil ekan…','Uf, yurak…',"Qo'rqitdingiz!"]),2.4,true)}return}
  if(a.act==='boxing'&&Math.random()<dt*1.5)part('conf',a.x*T+8,a.y*T-12,rand(-15,15),rand(-25,-10),.5,'#ffcf4a');
  if((a.act==='sleep'||a.act==='nap')&&Math.random()<dt*1.2)part('z',a.x*T+12,a.y*T-6,rand(2,6),-12,1.6,'#ffffff');
  if(a.panic>0&&a.act==='work'&&Math.random()<dt*2)part('sweat',a.x*T+(Math.random()<.5?3:13),a.y*T-6,rand(-6,6),-10,.7,'#7fd0ff');
  if(a.act==='dance'&&Math.random()<dt*1.4)part('note',a.x*T+8,a.y*T-8,rand(-10,10),-22,1.4,pick(CONF));
  if(!a.bubble&&Math.random()<dt*.04){const l=L[a.act]||(a.act==='work'&&Math.random()<.4?L.think:null);if(l)say(a,pick(l))}
  if(a.timer<=0){
    if(a.dest!==a.home)sendHome(a);
    else if(['dance','cheer','scared','scene','stand'].includes(a.act)){a.act=a.home.act;a.timer=rand(10,20)}
    else decide(a);
  }
}
function moveAlong(o,sp,dt){let st=sp*dt;while(st>0&&o.path.length){const n=o.path[0],dx=n.x-o.x,dy=n.y-o.y,d=Math.hypot(dx,dy);if(dx)o.dir=dx>0?'r':'l';if(d<=st){o.x=n.x;o.y=n.y;o.path.shift();st-=d}else{o.x+=dx/d*st;o.y+=dy/d*st;st=0}}}
function updatePets(dt){
  const c=pets.cat;c.anim+=dt;if(c.fx.jump>0)c.fx.jump-=dt;if(c.bubble){c.bubble.t-=dt;if(c.bubble.t<=0)c.bubble=null}
  if(c.path.length){moveAlong(c,c.fast?4.5:2.2,dt);c.sit=!c.path.length}
  else if(!c.lock){c.timer-=dt;if(c.timer<=0){const t=Math.random()<.3?{x:44,y:37}:randomTile(pick(['boss','lounge','open','all']));if(t)c.path=findPath(Math.round(c.x),Math.round(c.y),t.x,t.y)||[];c.timer=rand(6,14)}}
  const b=pets.bot;b.anim+=dt;if(b.turbo>0)b.turbo-=dt;

  else{b.timer-=dt;if(b.timer<=0||b.turbo>0){const t=randomTile(pick(['open','open','lounge','all']));if(t)b.path=findPath(Math.round(b.x),Math.round(b.y),t.x,t.y)||[];b.timer=rand(1,3)}}
  if(b.turbo>0&&Math.random()<dt*10)part('dust',b.x*T+8,b.y*T+12,rand(-15,15),rand(-10,-2),.5,'#fff');
}

  gameTime+=dt;tickWaits();

}

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const RAW_INTENTS=[
  ['stopfight',['urishma','urushma','toxta','bas ','bas qil','tinchlan','ajrat','xvatit','hvatit','stop','ostanov','janjal']],
  ['forgive',['qayt','kechirdim','kechiraman','vozvrash']],
  ['fear',['jarima','shtraf','boshatam','boshataman','ishdan boshat','jazo','nakaz','uvol','haydayman']],
  ['fire',['yongin','olov','pojar','pozhar','fire','yonyapti']],
  ['sleep',['uxla','spish','spite','spat','uyqu']],
  ['howru',['qalay','nima gap','yaxshimisiz','yaxshimisizlar','kak dela','kak vy','tinchmi','charchadingiz','nima qilyap','nima ish']],
  ['love',['yaxshi koraman','sevaman','lyublyu']],
  ['praise',['rahmat','barakalla','molodets','molodsy','spasibo','zor ','ofarin','yaxshi ishla','super','kuchli','malades','qoyil']],
  ['birthday',['tugilgan kun','tugulgan kun','den rojd','birthday','tort ']],
  ['food',['pizza','pitsa','pits','plov','osh ','ovqat','tushlik','obed','kushat','shashlik','lavash','yegani','qorin']],
  ['bonus',['bonus','mukofot','oylik','premiya','zarplat','maosh','pul ']],
  ['sale',['sotuv','sotinglar','sotish','prodaj','klient','qongiroq']],
  ['sport',['sport','zaryadka','mashq','trenirov','yugur','gimnast']],
  ['dance',['raqs','raks','tans','dans','musiqa','muzyk','bazm','disko']],
  ['meet',['majlis','yigil','uchrashuv','planerk','sobrani','meeting','soveshan']],
  ['home',['uyga','ish tugadi','domoy','ketinglar','javob ber']],
  ['break',['tanaffus','dam ol','pereryv','otdyx','otdyh','choy','qahva','kofe','perekur']],
  ['joke',['hazil','latifa','anekdot','kuldir','shutk','kulgi']],
  ['clean',['tozala','yigishtir','ubor','chist']],
  ['quiet',['jim ','tixo','tiho','shovqin','gapirma','ovozingiz']],
  ['greet',['salom','assalom','privet','zdravst','xayrli tong','hayrli tong','hello','hi ']],
  ['blame',['kim qildi','kim buzdi','kim aybdor','kto sdelal','kim ']],
  ['work',['ishla','ishga','tez','tezroq','harakat','qimirla','rabot','bystr','davay','work','dedlayn','deadline','bajar','dangasa']]
];
const INTENTS=RAW_INTENTS.map(([n,ws])=>[n,ws.map(w=>{const exact=w.endsWith(' ');const c=canon(norm(w).trim());return{w:c,exact,multi:c.includes(' ')}})]);
function hit(s,toks,k){
  if(k.multi)return s.includes(' '+k.w);
  if(k.exact)return toks.includes(k.w);
  return toks.some(t=>t.startsWith(k.w)||(k.w.length>=5&&t.length>=k.w.length-1&&lev(t.slice(0,k.w.length),k.w)<=1));
}
agents.forEach(a=>{a.ckeys=[...new Set(a.keys.map(k=>canon(norm(k).trim())))]});
function nameHit(toks,s,a){return a.ckeys.some(k=>k.includes(' ')?s.includes(' '+k):toks.some(t=>!t.startsWith('asalom')&&(t===k||(t.startsWith(k)&&t.length<=k.length+4)||(k.length>=5&&lev(t.slice(0,k.length),k)<=1))))}
const GROUPS=[['dasturchi',a=>a.team==='dev'],['programmist',a=>a.team==='dev'],['dizayner',a=>a.team==='dsg'],['marketolog',a=>a.team==='mkt'],['targetolog',a=>a.team==='mkt'],['smm',a=>a.team==='mkt'],['studiya',a=>a.team==='std'],['operator',a=>a.team==='std'],['sotuvchi',a=>a.team==='sales'],['menejer',a=>a.team==='sales'],['oshpaz',a=>a.team==='cook'],['povar',a=>a.team==='cook'],['qizlar',a=>a.fem],['devushk',a=>a.fem],['xonimlar',a=>a.fem],['yigitlar',a=>!a.fem],['parni',a=>!a.fem],['erkaklar',a=>!a.fem]].map(([w,f])=>[canon(norm(w).trim()),f]);
const LABEL={stopfight:"to'xtatish",forgive:'qaytish',fear:'jarima',fire:"yong'in",sleep:'uyqu tekshiruvi',howru:'hol-ahvol',love:'mehr',praise:'maqtov',birthday:"tug'ilgan kun",food:'ovqat',bonus:'bonus',sale:'sotuv',sport:'sport',dance:'raqs',meet:'majlis',home:'uyga',break:'tanaffus',joke:'latifa',clean:'tozalash',quiet:'jimlik',greet:'salom',blame:'aybdor qidirish',work:'ishga',call:'chaqirish',confused:'tushunmadi',fireperson:'ishdan haydash'};
const MOVERS=['work','break','meet','dance','bonus','fear','fire','fireperson','birthday','sport'];
let lastIntentAt={};
function understand(raw){
  const s=norm(raw);const toks=s.trim().split(' ').filter(Boolean);
  const named=agents.filter(a=>nameHit(toks,s,a));
  let group=null;for(const[w,f]of GROUPS)if(toks.some(t=>t.startsWith(w))){group=f;break}
  let intent=null;for(const[n,ks]of INTENTS)if(ks.some(k=>hit(s,toks,k))){intent=n;break}
  if(intent==='fear'&&named.length&&(s.includes(' ishdan')||s.includes(' boshat')||s.includes(' uvol')||s.includes(' hayda')))intent='fireperson';
  if(!intent&&named.length)intent='call';
  if(!intent)intent='confused';
  let list=named.length?named:group?agents.filter(a=>!a.hidden&&group(a)):agents.filter(a=>!a.hidden);
  if(intent==='forgive')list=named.length?named:agents.filter(a=>a.hidden);
  return{intent,list,named:named.length>0,names:named,text:s};
}
function command(raw){
  if(!raw||!raw.trim())return;
  const u=understand(raw);const now=performance.now();
  if(u.intent!=='confused'&&lastIntentAt[u.intent]&&now-lastIntentAt[u.intent]<1500)return;
  lastIntentAt[u.intent]=now;lastCmdAt=now;
  const loud=loudness>.14;
  if(MOVERS.includes(u.intent))u.list.forEach(a=>{if(a.scene&&u.intent!=='fireperson')freeAgent(a)});
  if(u.intent!=='forgive'&&u.intent!=='fireperson')u.list=u.list.filter(a=>!a.hidden);
  try{BOSS[u.intent](u.list,{loud,named:u.named,names:u.names,text:u.text})}catch(e){console.error(e)}
  const who=u.named?u.names.map(a=>a.name).join(', ')+' → ':'→ ';
  showHeard(raw,who+LABEL[u.intent],u.intent!=='confused');
}
function showHeard(txt,lab,ok,live){heard.innerHTML='';const q=document.createElement('span');q.textContent=(live?'👂 ':'🎤 ')+'«'+txt.trim()+'»';heard.appendChild(q);if(lab){const b=document.createElement('b');b.textContent='  '+lab;heard.appendChild(b)}
  heard.classList.add('show');heard.classList.toggle('cmd',!!ok);clearTimeout(heardTimer);heardTimer=setTimeout(()=>heard.classList.remove('show'),live?1800:3200)}
function toast(txt,ms=3600){heard.textContent=txt;heard.classList.add('show');heard.classList.remove('cmd');clearTimeout(heardTimer);heardTimer=setTimeout(()=>heard.classList.remove('show'),ms)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const inApp=/Telegram|Instagram|FBAN|FBAV|Line\/|wv\)/i.test(navigator.userAgent);
const coarse=matchMedia('(pointer:coarse)').matches;

function makeRec(){
  const r=new SR();r.lang=LANGS[langIdx][0];r.continuous=!coarse;r.interimResults=true;r.maxAlternatives=1;
  r.onstart=()=>{micBtn.classList.add('on')};
  r.onspeechstart=()=>{speaking=true};r.onspeechend=()=>{speaking=false};
  r.onresult=e=>{lastResultAt=performance.now();restarts=0;let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)command(res[0].transcript);else interim+=res[0].transcript}
    if(interim)showHeard(interim,'',false,true)};
  r.onerror=ev=>{const er=ev.error;
    if(er==='not-allowed'||er==='service-not-allowed'){micState='off';micBtn.classList.remove('on');toast("Mikrofonga ruxsat berilmadi. Brauzer sozlamalarida ruxsat bering yoki ⌨ bilan yozing.",6000);openKb()}
    else if(er==='network'){toast("Ovozni tanish uchun internet kerak (Google serveri). Tarmoqni tekshiring.",5000)}
    else if(er==='language-not-supported'){langIdx=(langIdx+1)%LANGS.length;langBtn.textContent=LANGS[langIdx][1];toast(LANGS[langIdx][1]+" tiliga o'tdim",3000)}
    else if(er==='audio-capture'){toast('Mikrofon topilmadi',4000)}};
  r.onend=()=>{speaking=false;if(micState==='on'){restarts++;if(restarts>40){toast("Tinglash to'xtadi. Tugmani qayta bosing.",4000);stopMic();return}setTimeout(()=>{if(micState!=='on')return;try{rec=makeRec();rec.start()}catch(e){}},coarse?150:300)}};
  return r;
}
async function startVolume(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
    actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaStreamSource(stream);
    analyser=actx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);buf=new Float32Array(analyser.fftSize);return true;
  }catch(e){return false}
}
function startMic(){
  wrap.classList.add('docked');
  if(SR){
    micState='on';micBtn.classList.add('on');micBtn.setAttribute('aria-label',"Mikrofonni o'chirish");
    try{rec=makeRec();rec.start()}catch(e){}
    if(!coarse)startVolume();
    toast('Tinglayapman ('+LANGS[langIdx][1]+')… gapiring, boss! Ekranda «👂» chiqsa, eshityapman.',4200);
    return;
  }
  micState='shout';micBtn.classList.add('shout');micBtn.setAttribute('aria-label','Buyruq berish');
  toast(inApp?"Telegram/Instagram ichida ovoz ishlamaydi. Linkni Chrome'da oching. Hozircha ⌨ bilan yozing.":"Bu brauzer ovozni so'zga aylantirmaydi (Chrome kerak). ⌨ bilan yozing yoki tugmani bosing.",7000);
  openKb();startVolume();
}
function stopMic(){micState='off';micBtn.classList.remove('on');micBtn.setAttribute('aria-label','Mikrofonni yoqish');
  try{rec&&rec.abort()}catch(e){}rec=null;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;try{actx&&actx.close()}catch(e){}analyser=null;ring.style.transform='scale(1)';toast("Mikrofon o'chirildi")}
let shoutIdx=0;
const SHOUTS=['Ishlanglar, tezroq!','Salom hammaga!','Qalaysizlar?','Raqsga tushinglar!','Aziz, ishla!','Bonus beraman!','Tanaffus!','Majlisga yig\'ilinglar!','Plov tayyormi?','Kim uxlayapti?','Latifa aytinglar','Sport qilinglar!','Sotuvchilar, sotinglar!','Yong\'in!','Urishmanglar!','Jarima!','Rahmat, barakalla!','Uyga ketinglar'];
function doShout(){const c=SHOUTS[shoutIdx++%SHOUTS.length];lastIntentAt={};command(c)}
micBtn.addEventListener('click',()=>{if(micState==='off')startMic();else if(micState==='on')stopMic();else doShout()});
langBtn.addEventListener('click',()=>{langIdx=(langIdx+1)%LANGS.length;langBtn.textContent=LANGS[langIdx][1];try{localStorage.setItem('ishxona-lang',langIdx)}catch(e){}
  toast(LANGS[langIdx][1]==='UZ'?"O'zbekcha tinglayman":'Ruscha tinglayman (o\'zbekcha so\'zlar ham tushuniladi)',2600);
  if(micState==='on'){try{rec&&rec.abort()}catch(e){}}});
function openKb(){form.hidden=false;wrap.classList.add('docked');setTimeout(()=>{try{input.focus()}catch(e){}},50)}
kbBtn.addEventListener('click',()=>{if(form.hidden)openKb();else form.hidden=true});
form.addEventListener('submit',e=>{e.preventDefault();const v=input.value;input.value='';lastIntentAt={};command(v)});
function micTick(){
  if(!analyser){ring.style.transform='scale('+(micState==='on'&&speaking?1.25+Math.sin(performance.now()/90)*.08:1)+')';return}
  analyser.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const rms=Math.sqrt(s/buf.length);
  level=Math.max(rms,level*.9);loudness=Math.max(rms,loudness*.97);ring.style.transform='scale('+(1+Math.min(.6,level*4))+')';
  const now=performance.now();
  if(rms>.17&&now-lastLoud>2500){lastLoud=now;pendingLoud=now;
    agents.forEach(a=>{if(a.hidden)return;const sens=a.pers==='qorqoq'?.95:a.pers==='dangasa'?.1:.3;if(Math.random()<sens){jump(a,.7);if(a.act==='sleep'){a.act='work';a.timer=rand(10,20)}if(Math.random()<.4)say(a,a.pers==='qorqoq'?pick(['Voy!','Aaa!']):a.pers==='isyon'||a.pers==='asabiy'?'Kim baqiryapti?':'?!',1.4,true)}})}
  if(pendingLoud&&now-pendingLoud>2600){if(lastCmdAt<pendingLoud){const q=agents.filter(a=>!a.hidden&&(a.pers==='qorqoq'||a.pers==='xushomad'));BOSS.work(q,{loud:true,named:false})}pendingLoud=0}
}

drawBG();
if(document.fonts&&document.fonts.load)document.fonts.load('8px Silkscreen').then(()=>drawBG()).catch(()=>{});
requestAnimationFrame(frame);
})();
