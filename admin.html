<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ishxona Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky toolbar, stat strip, then a scannable log list; one column on phones */
:root{--bg:#120f20;--panel:#1d1933;--panel2:#262144;--line:#352f5c;--fg:#f1edff;--muted:#a7a0cf;--accent:#ffcf4a;--ok:#5fd38d;--bad:#ff6b7a;--blue:#7aa8ff;
  --pixel:'Silkscreen',ui-monospace,monospace;--body:'Golos Text',system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:16px}
h1{font:700 clamp(22px,4vw,30px)/1 var(--pixel);margin:0}h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:12px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=search]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);outline:none}
input:focus{border-color:var(--accent)}
button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
button.primary{background:var(--accent);color:#1a1530;border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);min-height:1.2em;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:3}
.bar input[type=search]{flex:1 1 220px;width:auto}
.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font:700 22px/1.1 var(--pixel);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat.bad b{color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px}
.words span i{font-style:normal;color:var(--muted);margin-left:4px}
.day{font:12px var(--pixel);color:var(--muted);margin:14px 0 6px;letter-spacing:.06em}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.row time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.row .t{font-weight:600;word-break:break-word}
.row .l{font-size:13px;color:var(--ok);word-break:break-word}
.row .l.bad{color:var(--bad)}
.row .m{font-size:12px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:6px;align-items:center}
.acts button{padding:6px 10px;font-size:13px}
audio{height:32px;max-width:220px}
.pill{font-size:11px;border-radius:99px;padding:1px 8px;margin-left:6px;border:1px solid var(--line);color:var(--muted)}
.more{justify-self:center}
.empty{color:var(--muted);padding:20px 0;text-align:center}
details summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card login">
    <h1>ISHXONA <span>ADMIN</span></h1>
    <p class="sub">Odamlar bergan buyruqlar arxivi.</p>
    <form id="lf" style="display:grid;gap:10px">
      <input id="pw" type="password" placeholder="Parol" autocomplete="current-password" aria-label="Parol">
      <button class="primary" type="submit">Kirish</button>
      <div id="lerr" class="err" role="alert"></div>
    </form>
  </section>

  <section id="app" hidden>
    <header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px">
      <div><h1>ISHXONA <span>ADMIN</span></h1><p class="sub">Buyruqlar: o'yin nimani eshitdi va qanday tushundi.</p></div>
      <div style="display:flex;gap:8px"><a href="/" style="color:var(--accent)">O'yinga ↗</a></div>
    </header>
    <div class="stats" style="margin-top:14px">
      <div class="card stat"><b id="sTotal">0</b><small>Buyruqlar</small></div>
      <div class="card stat"><b id="sSess">0</b><small>O'yinchilar</small></div>
      <div class="card stat bad"><b id="sBad">0%</b><small>Tushunilmagan</small></div>
      <div class="card stat"><b id="sAudio">0</b><small>Ovozli yozuv</small></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="font:12px var(--pixel);color:var(--muted);margin-bottom:8px">TUSHUNILMAGAN BUYRUQLARDAGI KO'P SO'ZLAR</div>
      <div id="words" class="words"><span class="empty">Hali yo'q</span></div>
    </div>
    <div class="bar" style="margin-top:6px">
      <input id="q" type="search" placeholder="Qidirish…" aria-label="Qidirish">
      <label class="chk"><input id="fBad" type="checkbox"> Faqat tushunilmagan</label>
      <label class="chk"><input id="fAud" type="checkbox"> Faqat ovozli</label>
      <button id="csv" type="button">CSV nusxa</button>
      <button id="reload" type="button">Yangilash</button>
    </div>
    <div class="card"><div id="list"></div><div style="display:grid;margin-top:10px"><button id="more" class="more" type="button" hidden>Yana yuklash</button></div></div>
    <details class="card" style="margin-top:12px"><summary>Parolni o'zgartirish</summary>
      <form id="pf" style="display:grid;gap:8px;margin-top:10px;max-width:360px">
        <input id="np" type="password" placeholder="Yangi parol (kamida 6 belgi)" autocomplete="new-password" aria-label="Yangi parol">
        <button type="submit">Saqlash</button><div id="perr" class="err" role="status"></div>
      </form>
    </details>
  </section>
</div>
<script>
const SB='https://ljilvblrbdhdizvgqtyc.supabase.co',KEY='sb_publishable_dtWXod3KZbYtDS2U5_z8fQ_dMBma7IV';
let PASS='';let rows=[];let lastId=null;
const $=id=>document.getElementById(id);
async function rpc(fn,args){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||r.status);return j}
const isBad=r=>!r.label||/tushunmadi|→ \?$|^\?$/.test(r.label);
async function load(more){
  const data=await rpc('ishxona_admin_logs',{p_pass:PASS,p_limit:200,p_before:more?lastId:null});
  rows=more?rows.concat(data):data;lastId=rows.length?rows[rows.length-1].id:null;$('more').hidden=data.length<200;render();
}
function fmtDay(d){return d.toLocaleDateString('uz-UZ',{day:'numeric',month:'long',weekday:'long'})}
function render(){
  const q=$('q').value.trim().toLowerCase(),fb=$('fBad').checked,fa=$('fAud').checked;
  const vis=rows.filter(r=>(!q||(r.text+' '+(r.label||'')).toLowerCase().includes(q))&&(!fb||isBad(r))&&(!fa||r.has_audio));
  $('sTotal').textContent=rows.length;$('sSess').textContent=new Set(rows.map(r=>r.session)).size;
  const bad=rows.filter(isBad);$('sBad').textContent=rows.length?Math.round(bad.length/rows.length*100)+'%':'0%';$('sAudio').textContent=rows.filter(r=>r.has_audio).length;
  const freq={};bad.forEach(r=>r.text.toLowerCase().replace(/[^\p{L}\s']/gu,' ').split(/\s+/).filter(w=>w.length>2).forEach(w=>freq[w]=(freq[w]||0)+1));
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,24);const wd=$('words');wd.innerHTML='';
  if(!top.length)wd.innerHTML='<span class="empty">Hali yo\'q</span>';top.forEach(([w,n])=>{const s=document.createElement('span');s.textContent=w;const i=document.createElement('i');i.textContent='×'+n;s.appendChild(i);wd.appendChild(s)});
  const list=$('list');list.innerHTML='';if(!vis.length){list.innerHTML='<div class="empty">Buyruqlar yo\'q</div>';return}
  let day='';
  for(const r of vis){const d=new Date(r.created_at);const dk=d.toDateString();
    if(dk!==day){day=dk;const h=document.createElement('div');h.className='day';h.textContent=fmtDay(d).toUpperCase();list.appendChild(h)}
    const el=document.createElement('div');el.className='row';
    const tm=document.createElement('time');tm.textContent=d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
    const mid=document.createElement('div');const t=document.createElement('div');t.className='t';t.textContent='«'+r.text+'»';
    const pill=document.createElement('span');pill.className='pill';pill.textContent={voice:'ovoz',typed:'yozma',shout:'tugma'}[r.source]||r.source||'';t.appendChild(pill);
    const l=document.createElement('div');l.className='l'+(isBad(r)?' bad':'');l.textContent=r.label||'— tushunilmadi';
    const m=document.createElement('div');m.className='m';m.textContent=(r.device||'')+' · o\'yinchi '+(r.session||'').slice(0,4);
    mid.append(t,l,m);
    const acts=document.createElement('div');acts.className='acts';
    if(r.has_audio){const b=document.createElement('button');b.type='button';b.textContent='▶ Tinglash';b.onclick=async()=>{b.disabled=true;b.textContent='…';try{const a=(await rpc('ishxona_admin_audio',{p_pass:PASS,p_id:r.id}))[0];if(a&&a.audio){const au=document.createElement('audio');au.controls=true;au.src='data:'+(a.audio_type||'audio/webm')+';base64,'+a.audio;b.replaceWith(au);au.play().catch(()=>{})}else b.textContent='Yo\'q'}catch(e){b.textContent='Xato';b.disabled=false}};acts.appendChild(b)}
    const del=document.createElement('button');del.type='button';del.textContent='O\'chirish';del.onclick=async()=>{if(del.dataset.c!=='1'){del.dataset.c='1';del.textContent='Rostdanmi?';setTimeout(()=>{del.dataset.c='';del.textContent='O\'chirish'},3000);return}
      try{await rpc('ishxona_admin_delete',{p_pass:PASS,p_id:r.id});rows=rows.filter(x=>x.id!==r.id);render()}catch(e){del.textContent='Xato'}};acts.appendChild(del);
    el.append(tm,mid,acts);list.appendChild(el)}
}
$('lf').onsubmit=async e=>{e.preventDefault();PASS=$('pw').value;$('lerr').textContent='';try{await load(false);try{sessionStorage.setItem('ishxona-admin',PASS)}catch(_){}$('login').hidden=true;$('app').hidden=false}catch(err){$('lerr').textContent=/denied/.test(err.message)?'Parol noto\'g\'ri':'Ulanishda xato: '+err.message}};
['q','fBad','fAud'].forEach(id=>$(id).addEventListener('input',render));
$('reload').onclick=()=>load(false).catch(()=>{});$('more').onclick=()=>load(true).catch(()=>{});
$('csv').onclick=async()=>{const lines=[['vaqt','buyruq','tushunilgan','manba','qurilma']].concat(rows.map(r=>[r.created_at,r.text,r.label||'',r.source||'',r.device||''])).map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  try{await navigator.clipboard.writeText(lines);$('csv').textContent='Nusxalandi ✓'}catch(e){$('csv').textContent='Nusxalab bo\'lmadi'}setTimeout(()=>$('csv').textContent='CSV nusxa',2000)};
$('pf').onsubmit=async e=>{e.preventDefault();const np=$('np').value;try{await rpc('ishxona_admin_setpass',{p_old:PASS,p_new:np});PASS=np;try{sessionStorage.setItem('ishxona-admin',PASS)}catch(_){}$('perr').textContent='Saqlandi ✓';$('np').value=''}catch(err){$('perr').textContent=/short/.test(err.message)?'Kamida 6 belgi':'Xato'}};
try{const s=sessionStorage.getItem('ishxona-admin');if(s){$('pw').value=s;$('lf').requestSubmit()}}catch(e){}
</script>
</body>
</html>
